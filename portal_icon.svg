<svg width="340" height="390" viewBox="0 0 340 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="portal-shadow" x="15" y="8" width="315" height="375" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#09090b" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="portal-card-clip">
      <rect x="56" y="16" width="250" height="330" rx="28"/>
    </clipPath>

    <!-- Gradients for Subjects -->
    <linearGradient id="back-card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>

    <!-- Physics Amber -->
    <linearGradient id="phy-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Biology Emerald -->
    <linearGradient id="bio-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Chemistry Cyan/Indigo -->
    <linearGradient id="chem-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Core Spectrum Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. BACK TILTED NOTEBOOK CARD (Obsidian & Amber edge) -->
  <rect x="22" y="44" width="250" height="324" rx="28"
        transform="rotate(-6.5 22 44)"
        fill="url(#back-card-grad)" stroke="#ea580c" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- 2. FRONT NOTEBOOK CARD -->
  <g filter="url(#portal-shadow)">
    <rect x="56" y="16" width="250" height="330" rx="28" fill="#FFFFFF"/>

    <!-- Ruled Lines -->
    <g clip-path="url(#portal-card-clip)" stroke="#F0EFEA" stroke-width="2.5" stroke-linecap="round">
      <line x1="56" y1="58" x2="306" y2="58"/>
      <line x1="56" y1="92" x2="306" y2="92"/>
      <line x1="56" y1="126" x2="306" y2="126"/>
      <line x1="56" y1="160" x2="306" y2="160"/>
      <line x1="56" y1="194" x2="306" y2="194"/>
      <line x1="56" y1="228" x2="306" y2="228"/>
      <line x1="56" y1="262" x2="306" y2="262"/>
      <line x1="56" y1="296" x2="306" y2="296"/>
    </g>

    <!-- 3. UNIFIED SCIENCE TRINITY EMBLEM (Physics + Biology + Chemistry) -->
    <!-- Center coordinate: (181, 155) -->
    <circle cx="181" cy="155" r="70" fill="url(#core-glow)"/>

    <!-- A. CHEMISTRY: Hexagonal Benzene Ring (Tilted 30 deg for stability) -->
    <g stroke="url(#chem-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Outer Hexagon: radius 46 -->
      <polygon points="181,109 221,132 221,178 181,201 141,178 141,132" opacity="0.85"/>
      <!-- Inner Delocalized Circle -->
      <circle cx="181" cy="155" r="28" stroke-dasharray="6 4" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- B. PHYSICS: Elliptical Bohr Particle Orbit (60 deg tilt) -->
    <g>
      <ellipse cx="181" cy="155" rx="58" ry="24" transform="rotate(-35 181 155)" stroke="url(#phy-grad)" stroke-width="3.8" fill="none"/>
      <!-- Orbiting Quantum Particle -->
      <circle cx="228" cy="122" r="5.5" fill="#ea580c"/>
      <circle cx="228" cy="122" r="2.5" fill="#ffffff"/>
    </g>

    <!-- C. BIOLOGY: Interlaced DNA Double Helix Arc / Micro Ribbon -->
    <g>
      <ellipse cx="181" cy="155" rx="58" ry="24" transform="rotate(45 181 155)" stroke="url(#bio-grad)" stroke-width="3.8" fill="none"/>
      <!-- Biological Base Nodes -->
      <circle cx="134" cy="188" r="5" fill="#059669"/>
      <circle cx="134" cy="188" r="2" fill="#ffffff"/>
      <circle cx="140" cy="114" r="4.5" fill="#10b981"/>
    </g>

    <!-- Central Illuminated Nucleus / Nexus of First Principles -->
    <circle cx="181" cy="155" r="11" fill="#09090b"/>
    <circle cx="181" cy="155" r="7" fill="#ea580c"/>
    <circle cx="181" cy="155" r="3" fill="#ffffff"/>

    <!-- 4. SPECTRUM ACCENT PILL BAR (Physics Orange -> Bio Green -> Chem Blue) -->
    <defs>
      <linearGradient id="spectrum-bar" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ea580c"/>
        <stop offset="50%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#2563eb"/>
      </linearGradient>
    </defs>
    <rect x="109" y="250" width="144" height="9" rx="4.5" fill="url(#spectrum-bar)"/>
  </g>
</svg>