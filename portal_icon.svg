<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light Ceramic Gradient -->
    <linearGradient id="portal-light-bg" x1="40" y1="30" x2="480" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>

    <!-- Outer Platinum Bezel Rim -->
    <linearGradient id="portal-light-rim" x1="60" y1="20" x2="450" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Physics Gradient (Deep Amber / Flame Orange) -->
    <linearGradient id="phy-grad-light" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Biology Gradient (Deep Emerald / Forest Mint) -->
    <linearGradient id="bio-grad-light" x1="120" y1="390" x2="390" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Chemistry Gradient (Vivid Royal / Sapphire Blue) -->
    <linearGradient id="chem-grad-light" x1="256" y1="110" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Ambient Core Bloom -->
    <radialGradient id="core-light-glow" cx="256" cy="256" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Prism Center Facet -->
    <linearGradient id="prism-grad-light" x1="220" y1="220" x2="292" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Ceramic Studio Shadow -->
    <filter id="light-badge-shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Base Squircle with Soft Studio Shadow -->
  <g filter="url(#light-badge-shadow)">
    <!-- Canvas Shell -->
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#portal-light-bg)" stroke="url(#portal-light-rim)" stroke-width="1.8"/>
    <!-- Inner Hairline Bezel Highlight -->
    <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5"/>
  </g>

  <!-- Technical Coordinate Astrolabe & Polar Grids (Soft Slate Graphite) -->
  <g opacity="0.38">
    <!-- Concentric Rings -->
    <circle cx="256" cy="256" r="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 7" opacity="0.5"/>
    <circle cx="256" cy="256" r="162" stroke="#0284c7" stroke-width="1" opacity="0.4"/>
    <circle cx="256" cy="256" r="124" stroke="#64748b" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>
    <circle cx="256" cy="256" r="82" stroke="#64748b" stroke-width="1" stroke-dasharray="1 5" opacity="0.55"/>

    <!-- Reticle Crosshairs -->
    <line x1="256" y1="44" x2="256" y2="76" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="256" y1="436" x2="256" y2="468" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="44" y1="256" x2="76" y2="256" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="436" y1="256" x2="468" y2="256" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Cardinal Sub-ticks -->
    <circle cx="256" cy="56" r="2.5" fill="#0284c7"/>
    <circle cx="256" cy="456" r="2.5" fill="#ea580c"/>
    <circle cx="56" cy="256" r="2.5" fill="#059669"/>
    <circle cx="456" cy="256" r="2.5" fill="#0284c7"/>
  </g>

  <!-- Central Multi-Spectrum Ambient Glow -->
  <circle cx="256" cy="256" r="150" fill="url(#core-light-glow)"/>

  <!-- SCIENCE 1: CHEMISTRY · Molecular Benzene Hexagonal Geometry -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagonal Bond Perimeter (radius: 126) -->
    <polygon points="256,130 365,193 365,319 256,382 147,319 147,193"
             stroke="url(#chem-grad-light)" stroke-width="4.2" fill="none" opacity="0.92"/>

    <!-- Inner Delocalized Resonance Orbit (radius: 78) -->
    <circle cx="256" cy="256" r="78" stroke="url(#chem-grad-light)" stroke-width="2.2" stroke-dasharray="7 5" opacity="0.55" fill="none"/>

    <!-- Molecular Vertex Lattice Nodes -->
    <circle cx="256" cy="130" r="6.5" fill="#0284c7"/>
    <circle cx="256" cy="130" r="2.8" fill="#ffffff"/>
    <circle cx="365" cy="193" r="6.5" fill="#2563eb"/>
    <circle cx="365" cy="193" r="2.8" fill="#ffffff"/>
    <circle cx="365" cy="319" r="6.5" fill="#2563eb"/>
    <circle cx="365" cy="319" r="2.8" fill="#ffffff"/>
    <circle cx="256" cy="382" r="6.5" fill="#0284c7"/>
    <circle cx="256" cy="382" r="2.8" fill="#ffffff"/>
    <circle cx="147" cy="319" r="6.5" fill="#2563eb"/>
    <circle cx="147" cy="319" r="2.8" fill="#ffffff"/>
    <circle cx="147" cy="193" r="6.5" fill="#2563eb"/>
    <circle cx="147" cy="193" r="2.8" fill="#ffffff"/>
  </g>

  <!-- SCIENCE 2: PHYSICS · Quantum Bohr Particle Orbit (-32 deg) -->
  <g>
    <!-- Keplerian Orbit Ellipse -->
    <ellipse cx="256" cy="256" rx="162" ry="60" transform="rotate(-32 256 256)"
             stroke="url(#phy-grad-light)" stroke-width="4.5" fill="none"/>

    <!-- Quantum Energy Wavelets & Particle Packet -->
    <circle cx="388" cy="172" r="8" fill="#ea580c"/>
    <circle cx="388" cy="172" r="3.5" fill="#ffffff"/>
    <!-- Photon Emission Ring -->
    <circle cx="388" cy="172" r="15" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.65"/>
  </g>

  <!-- SCIENCE 3: BIOLOGY · Helical Nucleic Acid Arc & Micro-Ribbon (+38 deg) -->
  <g>
    <!-- Interlaced Biological Arc -->
    <ellipse cx="256" cy="256" rx="162" ry="60" transform="rotate(38 256 256)"
             stroke="url(#bio-grad-light)" stroke-width="4.5" fill="none"/>

    <!-- Cellular Base Pair Junction Nodes -->
    <circle cx="124" cy="340" r="7.5" fill="#059669"/>
    <circle cx="124" cy="340" r="3.2" fill="#ffffff"/>
    <circle cx="142" cy="172" r="6" fill="#10b981"/>
    <circle cx="142" cy="172" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Central Singularity Nexus & First Principles Nucleus -->
  <g>
    <!-- Faceted Micro Prism Diamond -->
    <polygon points="256,218 294,256 256,294 218,256" fill="url(#prism-grad-light)" opacity="0.95"/>
    <!-- Precision Bezel Ring Core -->
    <circle cx="256" cy="256" r="18" fill="#0f172a"/>
    <circle cx="256" cy="256" r="12" fill="#ea580c"/>
    <circle cx="256" cy="256" r="5" fill="#ffffff"/>
  </g>

  <!-- Technical Calibration Markings & Spectrum Identifier -->
  <g opacity="0.85">
    <!-- Triple Signature Calibration Dots -->
    <circle cx="236" cy="428" r="3.5" fill="#ea580c"/>
    <circle cx="256" cy="428" r="3.5" fill="#059669"/>
    <circle cx="276" cy="428" r="3.5" fill="#0284c7"/>

    <!-- Micro Linear Spectrum Bar -->
    <rect x="216" y="440" width="80" height="3.5" rx="1.75" fill="#cbd5e1" fill-opacity="0.6"/>
    <rect x="236" y="440" width="40" height="3.5" rx="1.75" fill="url(#prism-grad-light)"/>
  </g>
</svg>