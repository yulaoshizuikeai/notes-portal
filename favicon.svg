<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Clean Light Ceramic Squircle Shell -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>

  <!-- Chemistry: Molecular Hexagon -->
  <polygon points="16,6.6 23.6,11 23.6,21 16,25.4 8.4,21 8.4,11" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" opacity="0.85"/>

  <!-- Physics: Quantum Bohr Orbit (-30 deg) -->
  <ellipse cx="16" cy="16" rx="11" ry="4.2" transform="rotate(-30 16 16)" stroke="#ea580c" stroke-width="1.9"/>
  <circle cx="23.8" cy="11.5" r="1.5" fill="#ea580c"/>

  <!-- Biology: Nucleic Helix Orbit (+38 deg) -->
  <ellipse cx="16" cy="16" rx="11" ry="4.2" transform="rotate(38 16 16)" stroke="#059669" stroke-width="1.9"/>
  <circle cx="8.2" cy="21.5" r="1.5" fill="#059669"/>

  <!-- Unified Science Core / First Principles Nucleus -->
  <circle cx="16" cy="16" r="3.2" fill="#0f172a"/>
  <circle cx="16" cy="16" r="1.8" fill="#ea580c"/>
  <circle cx="16" cy="16" r="0.8" fill="#ffffff"/>
</svg>